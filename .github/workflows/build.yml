name: Build Biggs APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build APK
        run: |
          chmod +x./gradlew || echo "no gradlew"
          gradle :app:assembleDebug --no-daemon ||./gradlew :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: Biggs-APK
          path: app/build/outputs/apk/debug/*.apk
